name: Something's not working
description: A bug in the player, the plugin, the server or Pulse Disc
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Player, Plugin (recording), Server / deploy, Pulse Disc, Share links, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Browser or system
      placeholder: Chrome 140 on Windows 11, Claude Code desktop app on macOS…
  - type: textarea
    id: more
    attributes:
      label: Screenshot or anything else
