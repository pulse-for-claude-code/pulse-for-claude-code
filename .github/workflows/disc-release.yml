# Builds Pulse Disc for Windows and attaches it to the GitHub release when a version tag is pushed.
# No compiling: it puts Electron's official, checksum-verified build together with the disc's files.
name: Pulse Disc release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  disc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pulse Disc for Windows
        run: |
          bash desktop/assemble.sh win32-x64 "out/Pulse Disc"
          cd out && zip -qr "../Pulse-Disc-${GITHUB_REF_NAME}-windows-x64.zip" "Pulse Disc"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Pulse $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" Pulse-Disc-*-windows-x64.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-disc-windows-x64
          path: Pulse-Disc-*-windows-x64.zip
