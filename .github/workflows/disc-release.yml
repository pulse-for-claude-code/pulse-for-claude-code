# Builds Pulse Disc for Windows and attaches it to the GitHub release when a version tag is pushed.
# No compiling: it puts Electron's official, checksum-verified build together with the disc's files.
name: Pulse Disc release
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  disc:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pulse Disc for Windows
        run: |
          bash desktop/assemble.sh win32-x64 "out/Pulse Disc"
          cd out && zip -qr "../Pulse-Disc-${TAG}-windows-x64.zip" "Pulse Disc"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Pulse $TAG" --notes-file CHANGELOG.md
          gh release upload "$TAG" Pulse-Disc-*-windows-x64.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-disc-windows-x64
          path: Pulse-Disc-*-windows-x64.zip
